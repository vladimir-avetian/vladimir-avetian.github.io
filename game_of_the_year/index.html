<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ashen Oath</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Ashen Oath browser game">
      <header class="hud" aria-label="Game status">
        <div class="brand">Ashen Oath</div>

        <div class="meters" aria-live="polite">
          <div class="level-meter" aria-label="Current level">
            <span class="meter-label">LVL</span>
            <span id="levelCount">1</span>
            <span class="meter-slash">/</span>
            <span>5</span>
          </div>

          <div class="health-meter" aria-label="Knight health">
            <span class="meter-label">HP</span>
            <div id="healthPips" class="health-pips"></div>
          </div>

          <div class="kill-meter" aria-label="Green zombies banished">
            <span class="meter-label">GREEN</span>
            <span id="killCount">0</span>
            <span class="meter-slash">/</span>
            <span id="killTarget">0</span>
          </div>

          <div class="score-meter" aria-label="Score">
            <span class="meter-label">SCORE</span>
            <span id="scoreCount">0</span>
          </div>

          <div id="buffMeter" class="buff-meter" aria-label="Rage power">RAGE</div>

          <div class="soul-meter" aria-label="Soul statistics">
            <span>SAVED</span><span id="soulAscended">0</span>
            <span>HELL</span><span id="soulHell">0</span>
            <span>STUCK</span><span id="soulStuck">0</span>
          </div>
        </div>

        <button id="muteButton" class="icon-button" type="button" aria-label="Toggle sound" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-5v16l-5-5H4z"></path>
            <path class="sound-wave" d="M16 8c1.3 1.1 2 2.4 2 4s-.7 2.9-2 4"></path>
          </svg>
        </button>
      </header>

      <section class="stage-wrap" aria-label="Game stage">
        <canvas id="game" width="960" height="540"></canvas>

        <div id="screenOverlay" class="screen-overlay">
          <div id="overlayTitle" class="mark">Ashen Oath</div>
          <div id="overlayStats" class="overlay-stats hidden" aria-live="polite"></div>
          <button id="startButton" class="primary-button" type="button">Start</button>
        </div>

        <div class="touch-controls" aria-label="Touch controls">
          <div class="touch-cluster">
            <button class="touch-button" data-touch="left" type="button" aria-label="Move left">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 5 8 12l7 7"></path>
              </svg>
            </button>
            <button class="touch-button" data-touch="right" type="button" aria-label="Move right">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7"></path>
              </svg>
            </button>
          </div>

          <div class="touch-cluster">
            <button class="touch-button" data-touch="jump" type="button" aria-label="Jump">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m12 5 7 7h-4v7H9v-7H5z"></path>
              </svg>
            </button>
            <button class="touch-button blade-button" data-touch="attack" type="button" aria-label="Attack">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 3 5 14l5 5 11-9z"></path>
                <path d="m4 20 4-4"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
